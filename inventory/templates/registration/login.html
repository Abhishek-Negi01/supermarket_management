{% extends 'inventory/base.html' %}
{% block title %}Login - SuperMarket Pro{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="bg-white dark:bg-dark-800 rounded-lg shadow-lg p-6">
        <h2 class="text-2xl font-bold text-center text-gray-800 dark:text-white mb-6">Login</h2>
        
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Username</label>
                <input type="text" name="username" required 
                       class="w-full px-3 py-2 border border-gray-300 dark:border-dark-600 rounded-lg bg-white dark:bg-dark-700 text-gray-900 dark:text-white">
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
                <input type="password" name="password" required 
                       class="w-full px-3 py-2 border border-gray-300 dark:border-dark-600 rounded-lg bg-white dark:bg-dark-700 text-gray-900 dark:text-white">
            </div>
            
            <button type="submit" 
                    class="w-full px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition-colors">
                Login
            </button>
        </form>
        
        {% if form.errors %}
            <div class="mt-4 p-3 bg-red-100 dark:bg-red-900/30 border border-red-300 dark:border-red-700 rounded">
                <p class="text-red-800 dark:text-red-300">Invalid username or password.</p>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
