<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Low Stock Alert</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 20px;">
    <div style="background-color: #fff3cd; border: 1px solid #ffeaa7; padding: 15px; border-radius: 5px;">
        <h2 style="color: #856404; margin-top: 0;">⚠️ Low Stock Alert</h2>
        <p><strong>Product:</strong> {{ product.name }}</p>
        <p><strong>Current Stock:</strong> {{ stock_level }} units</p>
        <p><strong>Price:</strong> ₹{{ product.price }}</p>
        
        <div style="margin-top: 20px; padding: 10px; background-color: #f8f9fa; border-radius: 3px;">
            <p style="margin: 0;"><strong>Action Required:</strong> Please reorder this product to avoid stockout.</p>
        </div>
        
        <p style="margin-top: 20px; font-size: 12px; color: #6c757d;">
            This is an automated alert from SuperMarket Pro Inventory Management System.
        </p>
    </div>
</body>
</html>
