{% extends 'inventory/base.html' %}
{% block title %}Add Category - SuperMarket Pro{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-white">Add Category</h1>
  </div>

  <div class="bg-dark-800/50 rounded-2xl shadow-xl border border-dark-700 p-6">
    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label class="block text-gray-300 text-sm font-bold mb-2">Name</label>
        <input type="text" name="name" required class="w-full px-3 py-2 bg-dark-700 border border-dark-600 rounded-xl text-white focus:outline-none focus:border-emerald-500">
      </div>
      
      <div class="mb-6">
        <label class="block text-gray-300 text-sm font-bold mb-2">Description</label>
        <textarea name="description" rows="3" class="w-full px-3 py-2 bg-dark-700 border border-dark-600 rounded-xl text-white focus:outline-none focus:border-emerald-500"></textarea>
      </div>
      
      <div class="flex gap-4">
        <button type="submit" class="flex-1 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl transition-all">
          <i class="fas fa-save mr-2"></i>Save Category
        </button>
        <a href="{% url 'category_list' %}" class="flex-1 px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-xl transition-all text-center">
          <i class="fas fa-arrow-left mr-2"></i>Back
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
