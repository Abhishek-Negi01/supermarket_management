{% extends 'inventory/base.html' %}
{% block title %}Add Supplier - SuperMarket Pro{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-white">Add Supplier</h1>
  </div>

  <div class="bg-dark-800/50 rounded-2xl shadow-xl border border-dark-700 p-6">
    <form method="post">
      {% csrf_token %}
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-gray-300 text-sm font-bold mb-2">Name *</label>
          <input type="text" name="name" required class="w-full px-3 py-2 bg-dark-700 border border-dark-600 rounded-xl text-white focus:outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="block text-gray-300 text-sm font-bold mb-2">Contact Person</label>
          <input type="text" name="contact_person" class="w-full px-3 py-2 bg-dark-700 border border-dark-600 rounded-xl text-white focus:outline-none focus:border-purple-500">
        </div>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-gray-300 text-sm font-bold mb-2">Phone</label>
          <input type="tel" name="phone" class="w-full px-3 py-2 bg-dark-700 border border-dark-600 rounded-xl text-white focus:outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="block text-gray-300 text-sm font-bold mb-2">Email</label>
          <input type="email" name="email" class="w-full px-3 py-2 bg-dark-700 border border-dark-600 rounded-xl text-white focus:outline-none focus:border-purple-500">
        </div>
      </div>
      
      <div class="mb-6">
        <label class="block text-gray-300 text-sm font-bold mb-2">Address</label>
        <textarea name="address" rows="3" class="w-full px-3 py-2 bg-dark-700 border border-dark-600 rounded-xl text-white focus:outline-none focus:border-purple-500"></textarea>
      </div>
      
      <div class="flex gap-4">
        <button type="submit" class="flex-1 px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-xl transition-all">
          <i class="fas fa-save mr-2"></i>Save Supplier
        </button>
        <a href="{% url 'supplier_list' %}" class="flex-1 px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-xl transition-all text-center">
          <i class="fas fa-arrow-left mr-2"></i>Back
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
