{% extends 'inventory/base.html' %}
{% block title %}QR Scanner - SuperMarket Pro{% endblock %}
{% block content %}
<div class="min-h-screen flex flex-col">
  <!-- Header -->
  <div class="text-center py-4 px-4">
    <h1
      class="text-2xl md:text-3xl font-bold text-white mb-2 flex items-center justify-center"
    >
      <i class="fas fa-camera text-indigo-400 mr-2 md:mr-3"></i>
      QR Scanner
    </h1>
    <p class="text-gray-400 text-sm md:text-base">
      Scan product QR codes for billing
    </p>
  </div>

  <!-- Mobile-First Layout -->
  <div class="flex-1 px-4 pb-4">
    <!-- Success Toast - Fixed at top -->
    <div
      id="successToast"
      class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 hidden w-11/12 max-w-md"
    >
      <div
        class="bg-green-500 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center"
      >
        <i class="fas fa-check-circle text-2xl mr-3"></i>
        <div>
          <p class="font-bold">Scan Successful!</p>
          <p class="text-sm" id="toastMessage">Product added</p>
        </div>
      </div>
    </div>

    <!-- Results Section - Fixed at top, always visible -->
    <div
      class="bg-dark-800/50 rounded-2xl p-4 md:p-6 border border-dark-700 mb-4 sticky top-16 z-10"
    >
      <!-- Results Display - Compact -->
      <div id="result">
        <div class="p-3 bg-dark-700/50 rounded-xl text-center text-gray-400">
          <i class="fas fa-qrcode text-xl mb-1"></i>
          <p class="text-sm">Ready to scan</p>
        </div>
      </div>
    </div>

    <!-- Scanner Section -->
    <div
      class="bg-dark-800/50 rounded-2xl p-4 md:p-6 border border-dark-700 mb-4"
    >
      <div class="text-center mb-4">
        <h3
          class="text-lg md:text-xl font-semibold text-white flex items-center justify-center"
        >
          <i class="fas fa-qrcode text-indigo-400 mr-2"></i>
          Scanner
        </h3>
      </div>

      <!-- Scanner Container -->
      <div class="relative">
        <div
          id="reader"
          class="w-full max-w-sm mx-auto bg-dark-700 rounded-xl overflow-hidden"
        ></div>
        <div class="mt-3 text-center">
          <p class="text-gray-400 text-xs md:text-sm">
            Position QR code within frame
          </p>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="grid grid-cols-2 gap-3 sticky bottom-4">
      <a
        href="{% url 'billing_page' %}"
        class="flex items-center justify-center px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl transition-all text-sm shadow-lg"
      >
        <i class="fas fa-receipt mr-2"></i>
        <span id="billItemCount">View Bill</span>
      </a>
      <a
        href="{% url 'qr_dashboard' %}"
        class="flex items-center justify-center px-4 py-3 bg-gray-600 hover:bg-gray-700 text-white rounded-xl transition-all text-sm shadow-lg"
      >
        <i class="fas fa-tachometer-alt mr-2"></i>
        Dashboard
      </a>
    </div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  let isScanning = false; // Prevent multiple scans

  function onScanSuccess(decodedText, decodedResult) {
    // Prevent multiple scans within cooldown period
    if (isScanning) {
      $("#result").html(`
        <div class="p-4 bg-yellow-500/20 border border-yellow-500/30 rounded-xl text-center">
          <i class="fas fa-clock text-yellow-400 text-xl mb-2"></i>
          <p class="text-yellow-300 font-semibold">Please Wait</p>
          <p class="text-gray-400 text-sm">Processing previous scan...</p>
        </div>
      `);
      return;
    }
    isScanning = true;
    // Show scanning animation
    $("#result").html(`
      <div class="p-4 bg-blue-500/20 border border-blue-500/30 rounded-xl text-center">
        <i class="fas fa-spinner fa-spin text-blue-400 text-2xl mb-2"></i>
        <p class="text-blue-300">Processing scan...</p>
        <p class="text-gray-400 text-sm">QR: ${decodedText}</p>
      </div>
    `);

    // Parse QR code content (format: "id,name,price")
    const qrParts = decodedText.split(",");
    const productId = qrParts[0];

    $.post("{% url 'api_scan_product' %}", {
      product_id: productId,
      quantity: 1,
      scan_type: "BILL",
      csrfmiddlewaretoken: "{{ csrf_token }}",
    })
      .done(function (data) {
        if (data.success) {
          // Show success toast
          $("#toastMessage").text(`${data.product_name} - ₹${data.price}`);
          $("#successToast").removeClass("hidden").addClass("animate-fade-in");

          // Update result area
          $("#result").html(`
          <div class="p-3 bg-green-500/20 border border-green-500/30 rounded-xl">
            <div class="flex items-center justify-between">
              <div class="flex items-center">
                <i class="fas fa-check-circle text-green-400 text-lg mr-2"></i>
                <div>
                  <p class="text-white font-medium text-sm">${data.product_name}</p>
                  <p class="text-gray-300 text-xs">₹${data.price} | Stock: ${data.remaining_stock}</p>
                </div>
              </div>
            </div>
          </div>
        `);

          // Update bill button
          updateBillCount();

          // Hide toast after 2 seconds
          setTimeout(function () {
            $("#successToast").addClass("hidden");
          }, 2000);

          // Clear result after 3 seconds and allow next scan
          setTimeout(function () {
            $("#result").html(`
            <div class="p-3 bg-dark-700/50 rounded-xl text-center text-gray-400">
              <i class="fas fa-qrcode text-xl mb-1"></i>
              <p class="text-sm">Ready to scan</p>
            </div>
          `);
            isScanning = false;
          }, 3000);
        } else {
          $("#result").html(`
          <div class="p-3 bg-red-500/20 border border-red-500/30 rounded-xl">
            <div class="flex items-center">
              <i class="fas fa-exclamation-triangle text-red-400 text-lg mr-2"></i>
              <p class="text-red-300 text-sm">${data.error}</p>
            </div>
          </div>
        `);

          setTimeout(function () {
            $("#result").html(`
            <div class="p-3 bg-dark-700/50 rounded-xl text-center text-gray-400">
              <i class="fas fa-qrcode text-xl mb-1"></i>
              <p class="text-sm">Ready to scan</p>
            </div>
          `);
            isScanning = false;
          }, 3000);
        }
      })
      .fail(function () {
        $("#result").html(`
        <div class="p-3 bg-red-500/20 border border-red-500/30 rounded-xl">
          <div class="flex items-center">
            <i class="fas fa-exclamation-triangle text-red-400 text-lg mr-2"></i>
            <p class="text-red-300 text-sm">Connection Error</p>
          </div>
        </div>
      `);

        setTimeout(function () {
          $("#result").html(`
          <div class="p-3 bg-dark-700/50 rounded-xl text-center text-gray-400">
            <i class="fas fa-qrcode text-xl mb-1"></i>
            <p class="text-sm">Ready to scan</p>
          </div>
        `);
          isScanning = false;
        }, 3000);
      });
  }

  function onScanFailure(error) {
    // Handle scan failure silently
  }

  // Initialize scanner with responsive settings
  function getQrBoxSize() {
    const screenWidth = window.innerWidth;
    if (screenWidth < 400) {
      return { width: 200, height: 200 };
    } else if (screenWidth < 600) {
      return { width: 250, height: 250 };
    } else {
      return { width: 300, height: 300 };
    }
  }

  var html5QrcodeScanner = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: getQrBoxSize(),
      rememberLastUsedCamera: true,
      aspectRatio: 1.0,
    },
    false
  );

  // Reinitialize on window resize
  let resizeTimeout;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(function () {
      html5QrcodeScanner.clear();
      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: getQrBoxSize(),
          rememberLastUsedCamera: true,
          aspectRatio: 1.0,
        },
        false
      );
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }, 500);
  });

  html5QrcodeScanner.render(onScanSuccess, onScanFailure);

  // Update bill item count
  function updateBillCount() {
    $.get("{% url 'get_current_bill' %}").done(function (data) {
      if (data.success && data.item_count > 0) {
        $("#billItemCount").text(`Bill (${data.item_count})`);
      }
    });
  }

  // Initial count update
  updateBillCount();
</script>
{% endblock %}
